<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TezHost — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060610;
      --neon1: #00f5a0;
      --neon2: #00d9f5;
      --gold: #f5c842;
      --purple: #a855f7;
      --red: #f87171;
      --text: #f0f0ff;
      --muted: #6b7280;
      --border: rgba(255,255,255,0.08);
      --glass: rgba(255,255,255,0.04);
      --font: 'Outfit', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }

    /* BG */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(90px); opacity: 0.12;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .orb1 { width: 600px; height: 600px; background: radial-gradient(circle, var(--neon1), transparent); top: -200px; left: -150px; }
    .orb2 { width: 500px; height: 500px; background: radial-gradient(circle, var(--purple), transparent); bottom: -150px; right: -100px; animation-delay: -6s; animation-duration: 11s; }
    .orb3 { width: 350px; height: 350px; background: radial-gradient(circle, var(--neon2), transparent); top: 40%; left: 50%; animation-delay: -10s; animation-duration: 17s; }

    @keyframes drift {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(25px,-20px) scale(1.04); }
      100% { transform: translate(-20px,25px) scale(0.96); }
    }

    .grid-overlay {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,245,160,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,160,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(6,6,16,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
    }

    nav::after {
      content: '';
      position: absolute;
      bottom: 0; left: 5%; right: 5%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,245,160,0.2), rgba(0,217,245,0.2), transparent);
    }

    .nav-logo {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, var(--neon1), var(--neon2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-right { display: flex; align-items: center; gap: 0.8rem; }

    .nav-badge {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--neon1);
      background: rgba(0,245,160,0.08);
      border: 1px solid rgba(0,245,160,0.2);
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
    }

    .btn-logout {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.38rem 0.85rem;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.2s;
    }

    .btn-logout:hover { color: var(--red); border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.06); }

    /* MAIN */
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, var(--text) 60%, rgba(240,240,255,0.4));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-sub {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    .btn-new {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: linear-gradient(135deg, var(--neon1), var(--neon2));
      color: #060610;
      border: none;
      border-radius: 12px;
      padding: 0.65rem 1.3rem;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }

    .btn-new:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,245,160,0.35);
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem 1.4rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .stat:hover { border-color: rgba(0,245,160,0.2); }

    .stat::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,245,160,0.3), transparent);
    }

    .stat-val {
      font-family: var(--mono);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }

    .stat-val.neon { color: var(--neon1); text-shadow: 0 0 20px rgba(0,245,160,0.4); }
    .stat-val.cyan { color: var(--neon2); text-shadow: 0 0 20px rgba(0,217,245,0.4); }
    .stat-val.gold { color: var(--gold); text-shadow: 0 0 20px rgba(245,200,66,0.4); }

    .stat-lbl {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* UPLOAD PANEL */
    .upload-panel {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.8rem;
      margin-bottom: 1.8rem;
      display: none;
      position: relative;
      overflow: hidden;
      animation: panelIn 0.35s cubic-bezier(.22,.68,0,1.1) both;
    }

    .upload-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 5%; right: 5%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon1), var(--neon2), transparent);
      opacity: 0.5;
    }

    .upload-panel.show { display: block; }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--neon1);
      font-family: var(--mono);
    }

    .panel-close {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      background: var(--glass);
      border: 1px solid var(--border);
      transition: all 0.15s;
      font-size: 0.9rem;
    }

    .panel-close:hover { color: var(--red); border-color: rgba(248,113,113,0.3); }

    .form-group { margin-bottom: 1.1rem; }

    .f-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 0.5rem;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.78rem 1rem;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"]::placeholder { color: rgba(255,255,255,0.15); }

    input[type="text"]:focus {
      border-color: rgba(0,245,160,0.35);
      background: rgba(0,245,160,0.04);
      box-shadow: 0 0 0 3px rgba(0,245,160,0.07), 0 0 20px rgba(0,245,160,0.04);
    }

    .drop-zone {
      border: 1.5px dashed rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 2.2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255,255,255,0.02);
    }

    .drop-zone:hover, .drop-zone.over {
      border-color: rgba(0,245,160,0.4);
      background: rgba(0,245,160,0.04);
      box-shadow: 0 0 30px rgba(0,245,160,0.06) inset;
    }

    .drop-zone input { display: none; }
    .drop-icon { font-size: 2rem; margin-bottom: 0.6rem; }
    .drop-text { font-size: 0.85rem; color: var(--muted); }
    .drop-hint { font-family: var(--mono); font-size: 0.7rem; color: rgba(255,255,255,0.2); margin-top: 0.3rem; }
    .file-chosen { font-family: var(--mono); font-size: 0.78rem; color: var(--neon1); margin-top: 0.5rem; }

    .panel-footer {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.4rem;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--neon1), var(--neon2));
      color: #060610;
      border: none;
      border-radius: 12px;
      padding: 0.72rem 1.5rem;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,245,160,0.3); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-sec {
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 12px;
      padding: 0.72rem 1.2rem;
      font-family: var(--font);
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-sec:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* BOT CARDS */
    .bots-list { display: flex; flex-direction: column; gap: 0.9rem; }

    .bot-card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.25s;
      animation: cardIn 0.4s ease both;
      position: relative;
      overflow: hidden;
    }

    .bot-card::before {
      content: '';
      position: absolute;
      left: 0; top: 15%; bottom: 15%;
      width: 2px;
      background: linear-gradient(180deg, var(--neon1), var(--neon2));
      border-radius: 0 2px 2px 0;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .bot-card:hover {
      border-color: rgba(0,245,160,0.15);
      box-shadow: 0 4px 30px rgba(0,0,0,0.3), 0 0 60px rgba(0,245,160,0.03) inset;
      transform: translateY(-2px);
    }

    .bot-card:hover::before { opacity: 1; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bot-icon {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(0,245,160,0.1), rgba(0,217,245,0.1));
      border: 1px solid rgba(0,245,160,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .bot-info { flex: 1; min-width: 0; }

    .bot-name {
      font-weight: 600;
      font-size: 0.98rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }

    .bot-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-top: 0.35rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      font-family: var(--mono);
      font-weight: 500;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
    }

    .status-pill.on {
      background: rgba(0,245,160,0.1);
      color: var(--neon1);
      border: 1px solid rgba(0,245,160,0.25);
    }

    .status-pill.off {
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .s-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-pill.on .s-dot {
      animation: blink 2s infinite;
      box-shadow: 0 0 6px currentColor;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .bot-date {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: rgba(255,255,255,0.2);
    }

    .bot-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    .btn-sm {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.42rem 0.85rem;
      font-family: var(--font);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.18s;
      white-space: nowrap;
    }

    .btn-sm:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .btn-sm.start:hover { color: var(--neon1); border-color: rgba(0,245,160,0.3); background: rgba(0,245,160,0.06); }
    .btn-sm.stop:hover  { color: var(--gold);  border-color: rgba(245,200,66,0.3); background: rgba(245,200,66,0.06); }
    .btn-sm.del:hover   { color: var(--red);   border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.06); }
    .btn-sm:disabled    { opacity: 0.3; cursor: not-allowed; }

    /* EMPTY */
    .empty {
      background: var(--glass);
      border: 1px dashed rgba(255,255,255,0.07);
      border-radius: 20px;
      text-align: center;
      padding: 4.5rem 2rem;
    }

    .empty-icon { font-size: 2.8rem; margin-bottom: 1rem; filter: grayscale(0.3); }
    .empty-title { font-size: 1rem; font-weight: 600; color: rgba(255,255,255,0.5); }
    .empty-sub { font-size: 0.82rem; color: var(--muted); margin-top: 0.4rem; font-family: var(--mono); }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      font-size: 0.82rem;
      font-family: var(--mono);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(.22,.68,0,1.2);
      z-index: 100;
      max-width: 300px;
      backdrop-filter: blur(16px);
      border: 1px solid;
    }

    .toast.show { transform: translateY(0); opacity: 1; }

    .toast.ok {
      background: rgba(0,245,160,0.12);
      border-color: rgba(0,245,160,0.3);
      color: var(--neon1);
      box-shadow: 0 8px 30px rgba(0,245,160,0.15);
    }

    .toast.err {
      background: rgba(248,113,113,0.12);
      border-color: rgba(248,113,113,0.3);
      color: var(--red);
      box-shadow: 0 8px 30px rgba(248,113,113,0.15);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-size: 0.82rem;
      font-family: var(--mono);
    }

    @media (max-width: 540px) {
      .bot-card { flex-wrap: wrap; }
      .bot-actions { width: 100%; }
      .btn-sm { flex: 1; text-align: center; }
      .stats { grid-template-columns: 1fr 1fr; }
      nav { padding: 0 1rem; }
      main { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

  <div class="bg-layer">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>
  <div class="grid-overlay"></div>

  <nav>
    <div class="nav-logo">TezHost</div>
    <div class="nav-right">
      <span class="nav-badge" id="nav-email"></span>
      <button class="btn-logout" onclick="logout()">Chiqish</button>
    </div>
  </nav>

  <main>
    <div class="top-bar">
      <div>
        <div class="page-title">Botlarim</div>
        <div class="page-sub" id="page-sub">yuklanmoqda...</div>
      </div>
      <button class="btn-new" onclick="togglePanel()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Yangi bot
      </button>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats" style="display:none">
      <div class="stat">
        <div class="stat-val neon" id="s-total">0</div>
        <div class="stat-lbl">jami botlar</div>
      </div>
      <div class="stat">
        <div class="stat-val cyan" id="s-run">0</div>
        <div class="stat-lbl">ishlayapti</div>
      </div>
      <div class="stat">
        <div class="stat-val gold">3</div>
        <div class="stat-lbl">max limit</div>
      </div>
    </div>

    <!-- Upload panel -->
    <div class="upload-panel" id="upload-panel">
      <div class="panel-head">
        <div class="panel-title">// BOT YUKLASH</div>
        <div class="panel-close" onclick="togglePanel()">✕</div>
      </div>

      <div class="form-group">
        <label class="f-label">Bot nomi</label>
        <input type="text" id="bot-name" placeholder="Masalan: Salom bot" />
      </div>

      <div class="form-group">
        <label class="f-label">Python fayl (.py)</label>
        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('f-inp').click()">
          <input type="file" id="f-inp" accept=".py" onchange="onFile(this)" />
          <div class="drop-icon">📂</div>
          <div class="drop-text">Faylni bu yerga tashlang yoki bosing</div>
          <div class="drop-hint">faqat .py fayl qabul qilinadi</div>
          <div class="file-chosen" id="file-chosen"></div>
        </div>
      </div>

      <div class="panel-footer">
        <button class="btn-submit" id="up-btn" onclick="uploadBot()">Yuklash va ishga tushirish →</button>
        <button class="btn-sec" onclick="togglePanel()">Bekor</button>
      </div>
    </div>

    <!-- Bots list -->
    <div id="bots-wrap">
      <div class="loading">yuklanmoqda...</div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const API = "https://your-server-ip:5000";
    const token = localStorage.getItem("token");
    if (!token) location.href = "index.html";

    document.getElementById("nav-email").textContent = localStorage.getItem("email") || "";

    let bots = [];
    let selFile = null;

    function toast(msg, type = "ok") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast show ${type}`;
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    function fmt(ts) {
      return new Date(ts * 1000).toLocaleDateString("uz-UZ");
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function api(path, method = "GET", body = null) {
      const opts = { method, headers: { Authorization: `Bearer ${token}` } };
      if (body instanceof FormData) { opts.body = body; }
      else if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
      const res = await fetch(`${API}${path}`, opts);
      return { res, data: await res.json() };
    }

    async function loadBots() {
      try {
        const { res, data } = await api("/api/bots");
        if (res.status === 401) { localStorage.clear(); location.href = "index.html"; return; }
        if (!res.ok) throw new Error();
        bots = data;
        render();
      } catch {
        document.getElementById("bots-wrap").innerHTML = '<div class="loading">Yuklashda xato. Qayta urinib ko\'ring.</div>';
      }
    }

    function render() {
      const running = bots.filter(b => b.running).length;
      document.getElementById("page-sub").textContent = `${bots.length} / 3 bot · ${running} ta ishlayapti`;
      document.getElementById("s-total").textContent = bots.length;
      document.getElementById("s-run").textContent   = running;
      document.getElementById("stats").style.display = bots.length ? "grid" : "none";

      const wrap = document.getElementById("bots-wrap");

      if (!bots.length) {
        wrap.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🤖</div>
            <div class="empty-title">Hali botlar yo'q</div>
            <div class="empty-sub">// yangi bot yuklash uchun + tugmasini bosing</div>
          </div>`;
        return;
      }

      wrap.innerHTML = `<div class="bots-list">${bots.map((b, i) => `
        <div class="bot-card" style="animation-delay:${i * 0.06}s">
          <div class="bot-icon">🤖</div>
          <div class="bot-info">
            <div class="bot-name">${esc(b.name)}</div>
            <div class="bot-meta">
              <span class="status-pill ${b.running ? 'on' : 'off'}">
                <span class="s-dot"></span>
                ${b.running ? 'ishlayapti' : "to'xtagan"}
              </span>
              <span class="bot-date">${fmt(b.created_at)}</span>
            </div>
          </div>
          <div class="bot-actions">
            ${b.running
              ? `<button class="btn-sm stop" onclick="stopBot('${b.id}')">⏸ To'xtatish</button>`
              : `<button class="btn-sm start" onclick="startBot('${b.id}')">▶ Ishlatish</button>`}
            <button class="btn-sm del" onclick="delBot('${b.id}', '${esc(b.name)}')">🗑</button>
          </div>
        </div>`).join('')}</div>`;
    }

    async function startBot(id) {
      try {
        const { res, data } = await api(`/api/bots/${id}/start`, "POST");
        if (!res.ok) return toast(data.error || "Xato", "err");
        toast("▶ Bot ishga tushirildi");
        loadBots();
      } catch { toast("Xato", "err"); }
    }

    async function stopBot(id) {
      try {
        const { res, data } = await api(`/api/bots/${id}/stop`, "POST");
        if (!res.ok) return toast(data.error || "Xato", "err");
        toast("⏸ Bot to'xtatildi");
        loadBots();
      } catch { toast("Xato", "err"); }
    }

    async function delBot(id, name) {
      if (!confirm(`"${name}" o'chirilsinmi?`)) return;
      try {
        const { res, data } = await api(`/api/bots/${id}`, "DELETE");
        if (!res.ok) return toast(data.error || "Xato", "err");
        toast("🗑 Bot o'chirildi");
        loadBots();
      } catch { toast("Xato", "err"); }
    }

    function togglePanel() {
      const p = document.getElementById("upload-panel");
      p.classList.toggle("show");
      if (!p.classList.contains("show")) {
        document.getElementById("bot-name").value = "";
        document.getElementById("file-chosen").textContent = "";
        selFile = null;
      }
    }

    function onFile(inp) {
      selFile = inp.files[0];
      document.getElementById("file-chosen").textContent = selFile ? "✓ " + selFile.name : "";
    }

    const dz = document.getElementById("drop-zone");
    dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("over"));
    dz.addEventListener("drop", e => {
      e.preventDefault(); dz.classList.remove("over");
      const f = e.dataTransfer.files[0];
      if (f?.name.endsWith(".py")) { selFile = f; document.getElementById("file-chosen").textContent = "✓ " + f.name; }
      else toast("Faqat .py fayl qabul qilinadi", "err");
    });

    async function uploadBot() {
      if (!selFile) return toast("Avval fayl tanlang", "err");
      if (bots.length >= 3) return toast("Maksimal 3 ta bot", "err");
      const btn = document.getElementById("up-btn");
      btn.disabled = true; btn.textContent = "Yuklanmoqda...";
      try {
        const form = new FormData();
        form.append("file", selFile);
        const name = document.getElementById("bot-name").value.trim();
        if (name) form.append("name", name);
        const { res, data } = await api("/api/bots/upload", "POST", form);
        if (!res.ok) return toast(data.error || "Xato", "err");
        toast("✅ Bot yuklandi va ishga tushirildi!");
        togglePanel();
        loadBots();
      } catch { toast("Xato", "err"); }
      finally { btn.disabled = false; btn.textContent = "Yuklash va ishga tushirish →"; }
    }

    async function logout() {
      try { await api("/api/logout", "POST"); } catch {}
      localStorage.clear();
      location.href = "index.html";
    }

    loadBots();
    setInterval(loadBots, 15000);
  </script>
</body>
</html>
