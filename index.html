<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TezHost — Kirish</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060610;
      --neon1: #00f5a0;
      --neon2: #00d9f5;
      --gold: #f5c842;
      --purple: #a855f7;
      --text: #f0f0ff;
      --muted: #6b7280;
      --border: rgba(255,255,255,0.08);
      --glass: rgba(255,255,255,0.04);
      --glass2: rgba(255,255,255,0.07);
      --font: 'Outfit', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
    }

    /* ANIMATED BG */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .orb1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--neon1), transparent);
      top: -150px; left: -100px;
      animation-duration: 14s;
    }

    .orb2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, var(--purple), transparent);
      bottom: -100px; right: -80px;
      animation-duration: 10s;
      animation-delay: -5s;
    }

    .orb3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, var(--neon2), transparent);
      top: 50%; left: 55%;
      animation-duration: 16s;
      animation-delay: -8s;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(30px, -20px) scale(1.05); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* GRID OVERLAY */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0,245,160,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,160,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* WRAP */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      animation: rise 0.7s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* BRAND */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, var(--neon1) 0%, var(--neon2) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .brand-sub {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.5rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* CARD */
    .card {
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0,245,160,0.05),
        0 20px 60px rgba(0,0,0,0.5),
        0 0 80px rgba(0,245,160,0.03) inset;
      position: relative;
    }

    /* neon top line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon1), var(--neon2), transparent);
      opacity: 0.6;
    }

    /* TABS */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      padding: 1.1rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      font-family: var(--font);
      transition: all 0.25s;
      position: relative;
      letter-spacing: 0.02em;
    }

    .tab:first-child { border-right: 1px solid var(--border); }

    .tab.active {
      color: var(--neon1);
      background: rgba(0,245,160,0.04);
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 25%; right: 25%;
      height: 2px;
      background: linear-gradient(90deg, var(--neon1), var(--neon2));
      border-radius: 2px 2px 0 0;
      box-shadow: 0 0 8px var(--neon1);
    }

    /* FORM */
    .form-body { padding: 2rem; }

    .err-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.82rem;
      color: #f87171;
      margin-bottom: 1.2rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      animation: shake 0.3s ease;
    }

    .err-box.show { display: flex; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .form-group { margin-bottom: 1.1rem; }

    .f-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    input::placeholder { color: rgba(255,255,255,0.18); }

    input:focus {
      border-color: rgba(0,245,160,0.4);
      background: rgba(0,245,160,0.04);
      box-shadow: 0 0 0 3px rgba(0,245,160,0.08), 0 0 20px rgba(0,245,160,0.05);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--neon1), var(--neon2));
      color: #060610;
      border: none;
      border-radius: 12px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.25s;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,245,160,0.35), 0 0 60px rgba(0,245,160,0.1);
    }

    .btn:hover::before { opacity: 1; }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <div class="bg-layer">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>
  <div class="grid-overlay"></div>

  <div class="wrap">
    <div class="brand">
      <div class="brand-logo">TezHost</div>
      <div class="brand-sub">Telegram Bot Hosting Platform</div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Kirish</button>
        <button class="tab" onclick="switchTab('register')">Ro'yxat</button>
      </div>

      <div class="form-body">
        <div class="err-box" id="err">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="err-text"></span>
        </div>

        <div id="login-form">
          <div class="form-group">
            <label class="f-label">Email</label>
            <input type="email" id="l-email" placeholder="siz@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="f-label">Parol</label>
            <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button class="btn" id="l-btn" onclick="doLogin()">Kirish →</button>
        </div>

        <div id="reg-form" style="display:none">
          <div class="form-group">
            <label class="f-label">Email</label>
            <input type="email" id="r-email" placeholder="siz@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="f-label">Parol</label>
            <input type="password" id="r-pass" placeholder="Kamida 6 belgi" autocomplete="new-password" />
          </div>
          <button class="btn" id="r-btn" onclick="doRegister()">Ro'yxatdan o'tish →</button>
        </div>
      </div>
    </div>

    <div class="footer">© 2025 TEZHOST · ALL RIGHTS RESERVED</div>
  </div>

  <script>
    const API = "https://your-server-ip:5000";

    if (localStorage.getItem("token")) location.href = "dashboard.html";

    function switchTab(t) {
      document.querySelectorAll('.tab').forEach((el, i) =>
        el.classList.toggle('active', (i===0&&t==='login')||(i===1&&t==='register')));
      document.getElementById('login-form').style.display = t==='login' ? 'block' : 'none';
      document.getElementById('reg-form').style.display   = t==='register' ? 'block' : 'none';
      hideErr();
    }

    function showErr(m) {
      document.getElementById('err-text').textContent = m;
      document.getElementById('err').classList.add('show');
    }
    function hideErr() { document.getElementById('err').classList.remove('show'); }

    async function doLogin() {
      const email = document.getElementById('l-email').value.trim();
      const pass  = document.getElementById('l-pass').value;
      if (!email || !pass) return showErr("Email va parol kiriting");
      const btn = document.getElementById('l-btn');
      btn.disabled = true; btn.textContent = "Yuklanmoqda...";
      try {
        const res  = await fetch(`${API}/api/login`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email, password:pass}) });
        const data = await res.json();
        if (!res.ok) return showErr(data.error || "Xato");
        localStorage.setItem("token", data.token);
        localStorage.setItem("email", data.email);
        location.href = "dashboard.html";
      } catch { showErr("Server bilan bog'lanib bo'lmadi"); }
      finally { btn.disabled=false; btn.textContent="Kirish →"; }
    }

    async function doRegister() {
      const email = document.getElementById('r-email').value.trim();
      const pass  = document.getElementById('r-pass').value;
      if (!email || !pass) return showErr("Email va parol kiriting");
      if (pass.length < 6) return showErr("Parol kamida 6 belgi bo'lishi kerak");
      const btn = document.getElementById('r-btn');
      btn.disabled = true; btn.textContent = "Yuklanmoqda...";
      try {
        const res  = await fetch(`${API}/api/register`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email, password:pass}) });
        const data = await res.json();
        if (!res.ok) return showErr(data.error || "Xato");
        localStorage.setItem("token", data.token);
        localStorage.setItem("email", data.email);
        location.href = "dashboard.html";
      } catch { showErr("Server bilan bog'lanib bo'lmadi"); }
      finally { btn.disabled=false; btn.textContent="Ro'yxatdan o'tish →"; }
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const isLogin = document.getElementById('login-form').style.display !== 'none';
      if (isLogin) doLogin(); else doRegister();
    });
  </script>
</body>
</html>
